<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOGGHUB | ELITE AI ANALYSIS V4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #050806;
            --card: rgba(16, 24, 20, 0.85);
            --card-hover: rgba(20, 30, 25, 0.95);
            --accent: #2DD881;
            --accent-glow: rgba(45, 216, 129, 0.4);
            --text: #e0e0e0;
            --br: 24px;
            --border: rgba(45, 216, 129, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(45, 216, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45, 216, 129, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            from { background-position: 0 0; }
            to { background-position: 40px 40px; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .logo span { background: var(--accent); color: var(--bg); padding: 0 8px; border-radius: 6px; margin-left: 4px; }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 25px;
        }

        .analyzer-panel {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--br);
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .drop-zone {
            width: 100%;
            height: 400px;
            border: 1px dashed var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
        }

        .drop-zone:hover { border-color: var(--accent); background: rgba(45, 216, 129, 0.05); }

        #preview-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            position: absolute;
            z-index: 1;
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: var(--accent);
            box-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
            z-index: 10;
            top: -10px;
            display: none;
        }

        @keyframes scanMove { 0% { top: 0; } 100% { top: 100%; } }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .console-box {
            background: #000;
            border-radius: 16px;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            height: 180px;
            overflow-y: hidden;
            border: 1px solid #111;
        }

        .log-entry { margin-bottom: 5px; opacity: 0.9; }

        .result-display {
            background: var(--card);
            border-radius: var(--br);
            padding: 30px;
            text-align: center;
            border: 1px solid var(--border);
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .big-score {
            font-size: 6rem;
            font-weight: 900;
            line-height: 1;
            margin: 10px 0;
            letter-spacing: -3px;
            filter: drop-shadow(0 0 20px var(--accent-glow));
        }

        .status-label { font-weight: 900; font-size: 1.5rem; letter-spacing: 2px; }

        .btn-group { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-top: 20px; }
        
        .btn {
            padding: 18px;
            border-radius: 14px;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary { background: var(--accent); color: var(--bg); box-shadow: 0 8px 25px var(--accent-glow); }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-secondary { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); }

        .upgrade-header {
            text-align: center;
            margin: 60px 0 30px 0;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }
        
        .upgrade-header span { color: var(--accent); }

        .tier-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .tier-card {
            background: var(--card);
            padding: 40px 30px;
            border-radius: var(--br);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            transition: 0.3s;
        }

        .tier-card.premium { border-color: var(--accent); position: relative; overflow: hidden; }
        .tier-card.premium::before {
            content: 'BEST VALUE';
            position: absolute;
            top: 20px; right: -30px;
            background: var(--accent);
            color: var(--bg);
            font-size: 0.7rem;
            font-weight: 900;
            padding: 5px 30px;
            transform: rotate(45deg);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--bg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            padding: 40px;
            position: relative;
            transform: translateY(20px);
            transition: 0.3s ease;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }

        .modal-overlay.active .modal-content { transform: translateY(0); }

        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: transparent;
            border: none;
            color: #666;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover { color: #fff; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; }
        .input-group input {
            width: 100%; padding: 15px; border-radius: 12px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-family: 'Outfit'; font-size: 1rem; transition: 0.3s;
        }
        .input-group input:focus { outline: none; border-color: var(--accent); background: rgba(45, 216, 129, 0.05); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .side-panel { flex-direction: column; }
            .drop-zone { height: 320px; }
            .analyzer-panel { padding: 20px; }
            .big-score { font-size: 5rem; }
            .btn-group { grid-template-columns: 1fr; }
            .upgrade-header { font-size: 1.5rem; }
            .modal-content { padding: 30px 20px; margin: 20px; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>

<div class="container">
    <header>
        <div class="logo">MOGG<span>HUB</span></div>
    </header>

    <main class="main-grid">
        <section class="analyzer-panel">
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <div class="scanner-line" id="scanner"></div>
                <div id="drop-content" style="text-align: center; z-index: 2; transition: 0.5s;">
                    <i class="fa-solid fa-camera" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
                    <h2 style="font-weight: 900; margin-bottom: 5px;">UPLOAD PHOTO</h2>
                    <p style="color: #666; font-size: 0.8rem; text-transform: uppercase;">Tap to select image</p>
                </div>
                <canvas id="preview-canvas"></canvas>
                <input type="file" id="fileInput" hidden accept="image/*">
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="scanBtn" disabled>
                    <i class="fa-solid fa-bolt"></i> ANALYZE
                </button>
                <button class="btn btn-secondary" onclick="location.reload()">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </section>

        <aside class="side-panel">
            <div class="result-display" id="resultCard">
                <p style="text-transform: uppercase; font-size: 0.8rem; color: #888; font-weight: 700;">Final Score</p>
                <div class="big-score" id="scoreValue">0.0</div>
                <div class="status-label" id="statusLabel">---</div>
                
                <div style="width: 100%; height: 6px; background: #111; margin: 20px 0; border-radius: 10px; overflow: hidden;">
                    <div id="scoreBar" style="height: 100%; width: 0%; background: var(--accent); transition: 1s cubic-bezier(0.22, 1, 0.36, 1);"></div>
                </div>
            </div>

            <div class="console-box" id="console">
                <div class="log-entry" style="color: #666;">> System online...</div>
                <div class="log-entry" style="color: #666;">> Waiting for image input...</div>
            </div>
        </aside>
    </main>

    <h2 class="upgrade-header">UPGRADE TO MOGGHUB<span>+</span></h2>
    <div class="tier-grid">
        <div class="tier-card">
            <h3 style="color: #fff; margin-bottom: 10px; font-weight: 900;">PRO</h3>
            <div style="font-size: 2.5rem; font-weight: 900; margin-bottom: 5px;">$9<span style="font-size: 1rem; color: #666;">.99</span></div>
            <p style="font-size: 0.9rem; color: #888; margin-bottom: 30px;">PDF Report + Symmetry Analysis</p>
            <button class="btn btn-secondary" style="width: 100%;" onclick="openModal('PRO TIER')">Select Pro</button>
        </div>
        <div class="tier-card premium">
            <h3 style="color: var(--accent); margin-bottom: 10px; font-weight: 900;">ELITE</h3>
            <div style="font-size: 2.5rem; font-weight: 900; margin-bottom: 5px;">$19<span style="font-size: 1rem; color: #666;">.99</span></div>
            <p style="font-size: 0.9rem; color: #888; margin-bottom: 30px;">Deep Scan + Anonymous Mode</p>
            <button class="btn btn-primary" style="width: 100%;" onclick="openModal('ELITE TIER')">Join Elite</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="paymentModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        <h2 style="font-weight: 900; margin-bottom: 5px; font-size: 1.8rem;">SECURE CHECKOUT</h2>
        <p style="color: #888; font-size: 0.9rem; margin-bottom: 30px;" id="modalPlanName">Selected Plan: --</p>

        <div class="input-group">
            <label>Card Number</label>
            <input type="text" placeholder="0000 0000 0000 0000" maxlength="19">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="input-group">
                <label>Expiry</label>
                <input type="text" placeholder="MM/YY" maxlength="5">
            </div>
            <div class="input-group">
                <label>CVC</label>
                <input type="password" placeholder="***" maxlength="3">
            </div>
        </div>
        
        <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="processPayment()">
            <i class="fa-solid fa-lock"></i> PAY NOW
        </button>
        <p style="text-align: center; font-size: 0.7rem; color: #555; margin-top: 15px; font-family: 'JetBrains Mono';">Encrypted via Stripe 256-bit SSL</p>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const dropContent = document.getElementById('drop-content');
    const scanBtn = document.getElementById('scanBtn');
    const scanner = document.getElementById('scanner');
    const consoleBox = document.getElementById('console');
    const resultCard = document.getElementById('resultCard');
    
    let rawImageData = null;

    function addLog(text, color = "var(--accent)") {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span style="color: #444;">[SYS]</span> <span style="color: ${color}">${text}</span>`;
        consoleBox.appendChild(entry);
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    function handleFile(file) {
        if (!file) return;
        addLog(`Image loaded: ${file.name}`);
        
        const img = new Image();
        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            
            canvas.style.display = 'block';
            dropContent.style.opacity = '0';
            scanBtn.disabled = false;
            
            rawImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            addLog("Pixel buffer ready.");
        };
        img.src = URL.createObjectURL(file);
    }

    scanBtn.onclick = async () => {
        scanBtn.disabled = true;
        resultCard.style.display = 'none';
        scanner.style.display = 'block';
        scanner.style.animation = 'scanMove 1.5s infinite linear';
        
        const phases = [
            "Extracting facial landmarks...",
            "Analyzing jawline geometry...",
            "Evaluating lighting & contrast...",
            "Cross-referencing database..."
        ];

        for (let phase of phases) {
            addLog(phase);
            await new Promise(r => setTimeout(r, 600));
        }

        executeAdvancedAnalysis();
    };

    function executeAdvancedAnalysis() {
        if (!rawImageData) return;

        const data = rawImageData.data;
        const width = canvas.width;
        
        let edgeScore = 0;
        let brightnessTotal = 0;
        let samples = 0;

        // Продвинутая математическая модель анализа
        for (let i = 0; i < data.length; i += 64) { 
            let r = data[i], g = data[i+1], b = data[i+2];
            let lum = (r * 0.299 + g * 0.587 + b * 0.114);
            
            brightnessTotal += lum;
            samples++;

            if (i > width * 4 && i % (width * 4) > 4) {
                let prevH = (data[i-4] * 0.299 + data[i-3] * 0.587 + data[i-2] * 0.114);
                let prevV = (data[i - width*4] * 0.299 + data[i - width*4 + 1] * 0.587 + data[i - width*4 + 2] * 0.114);
                edgeScore += Math.abs(lum - prevH) + Math.abs(lum - prevV);
            }
        }

        const avgBrightness = brightnessTotal / samples;
        const avgEdge = edgeScore / samples;
        
        // Реалистичный расчет (6.2 - средняя база)
        let finalScore = 6.2; 

        // Коррекция по детализации
        let edgeFactor = (avgEdge / 20); 
        finalScore += (edgeFactor - 1) * 1.5; 

        // Штраф за плохое освещение
        let lightDeviation = Math.abs(avgBrightness - 127);
        if (lightDeviation > 50) {
            finalScore -= (lightDeviation - 50) * 0.02;
        }

        // Микро-вариация для естественности
        let microVariance = (Math.sin(avgBrightness * avgEdge) * 0.3);
        finalScore += microVariance;

        // Лимиты при плохом качестве
        if (finalScore > 8.5 && (avgBrightness < 80 || avgBrightness > 200)) {
            finalScore = 8.5;
        }

        let totalResult = Math.min(9.8, Math.max(3.1, finalScore));
        displayResults(parseFloat(totalResult.toFixed(1)));
    }

    function displayResults(score) {
        scanner.style.display = 'none';
        resultCard.style.display = 'block';
        
        let status = "";
        let color = "";

        if (score < 5.0) { status = "SUB-5"; color = "#ff4b4b"; }
        else if (score < 6.8) { status = "MTN"; color = "#ffd151"; }
        else if (score < 8.2) { status = "HTN"; color = "#7be495"; }
        else if (score < 9.4) { status = "CHAD"; color = "#2dd881"; }
        else { status = "MOGGHUNTER"; color = "#00ff7f"; }

        document.getElementById('scoreValue').innerText = score.toFixed(1);
        document.getElementById('scoreValue').style.color = color;
        document.getElementById('statusLabel').innerText = status;
        document.getElementById('statusLabel').style.color = color;
        
        setTimeout(() => {
            document.getElementById('scoreBar').style.width = (score * 10) + "%";
            document.getElementById('scoreBar').style.backgroundColor = color;
        }, 50);

        addLog(`Result: ${status} (${score.toFixed(1)})`, color);

        if(window.innerWidth <= 900) {
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    const modal = document.getElementById('paymentModal');
    function openModal(planName) {
        document.getElementById('modalPlanName').innerText = `Selected Plan: ${planName}`;
        modal.classList.add('active');
    }
    function closeModal() { modal.classList.remove('active'); }
    function processPayment() {
        const btn = document.querySelector('.modal-content .btn-primary');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PROCESSING...';
        setTimeout(() => {
            btn.innerHTML = '<i class="fa-solid fa-check"></i> PAYMENT FAILED: MOCK UI';
            btn.style.background = '#ff4b4b';
            setTimeout(() => {
                closeModal();
                btn.innerHTML = '<i class="fa-solid fa-lock"></i> PAY NOW';
                btn.style.background = 'var(--accent)';
            }, 2000);
        }, 1500);
    }
</script>

</body>
</html>
