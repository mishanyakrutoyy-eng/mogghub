<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOGGHUB | ELITE AI ANALYSIS V3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #050806;
            --card: rgba(16, 24, 20, 0.85);
            --accent: #2DD881;
            --accent-glow: rgba(45, 216, 129, 0.4);
            --text: #e0e0e0;
            --br: 32px;
            --border: rgba(45, 216, 129, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Анимированный фон сетки */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(45, 216, 129, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45, 216, 129, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            from { background-position: 0 0; }
            to { background-position: 50px 50px; }
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
            animation: slideDown 0.8s ease;
        }

        .logo {
            font-weight: 900;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .logo span { color: #fff; background: var(--accent); color: var(--bg); padding: 0 10px; border-radius: 6px; margin-left: 5px; }

        /* Main UI Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
        }

        .analyzer-panel {
            background: var(--card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: var(--br);
            padding: 40px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            position: relative;
            animation: fadeIn 1s ease both;
        }

        .drop-zone {
            width: 100%;
            height: 480px;
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            background: rgba(0,0,0,0.4);
        }

        .drop-zone:hover {
            border-color: var(--accent);
            background: rgba(45, 216, 129, 0.03);
        }

        #preview-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            position: absolute;
            z-index: 1;
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 6px;
            background: linear-gradient(transparent, var(--accent), transparent);
            box-shadow: 0 0 20px var(--accent);
            z-index: 10;
            top: -10px;
            display: none;
        }

        @keyframes scanMove {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Console & Results */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .console-box {
            background: #000;
            border-radius: 20px;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            height: 220px;
            overflow-y: hidden;
            border: 1px solid #111;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }

        .log-entry { margin-bottom: 4px; opacity: 0.9; }

        .result-display {
            background: var(--card);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            border: 1px solid var(--border);
            display: none;
            animation: slideUp 0.5s ease forwards;
        }

        .big-score {
            font-size: 5.5rem;
            font-weight: 900;
            margin: 5px 0;
            letter-spacing: -4px;
            filter: drop-shadow(0 0 15px var(--accent-glow));
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .main-btn {
            padding: 20px;
            border-radius: 18px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-scan { background: var(--accent); color: var(--bg); box-shadow: 0 10px 30px var(--accent-glow); }
        .btn-scan:hover { transform: translateY(-3px) scale(1.02); filter: brightness(1.1); }
        .btn-scan:disabled { opacity: 0.2; cursor: not-allowed; transform: none; }

        .btn-reset { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn-reset:hover { background: rgba(255,255,255,0.1); }

        /* Tiers */
        .tier-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 60px;
        }

        .tier-card {
            background: var(--card);
            padding: 30px;
            border-radius: var(--br);
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.4s;
            text-align: center;
        }

        .tier-card:hover { border-color: var(--accent); background: rgba(45, 216, 129, 0.05); }

        /* Animations */
        @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .drop-zone { height: 350px; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>

<div class="container">
    <header>
        <div class="logo">MOGG<span>HUB</span></div>
        <div style="font-size: 0.7rem; font-weight: 700; letter-spacing: 3px; color: var(--accent);">V3.0 // NEURAL_ENGINE</div>
    </header>

    <main class="main-grid">
        <!-- Analyzer Section -->
        <section class="analyzer-panel">
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <div class="scanner-line" id="scanner"></div>
                
                <div id="drop-content" style="text-align: center; z-index: 2; transition: 0.5s;">
                    <i class="fa-solid fa-expand" style="font-size: 3.5rem; color: var(--accent); margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--accent-glow));"></i>
                    <h2 style="font-weight: 900; margin-bottom: 10px; letter-spacing: 1px;">UPLOAD SUBJECT</h2>
                    <p style="color: #666; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Ready for facial biometric scan</p>
                </div>

                <canvas id="preview-canvas"></canvas>
                <input type="file" id="fileInput" hidden accept="image/*">
            </div>

            <div class="btn-group">
                <button class="main-btn btn-scan" id="scanBtn" disabled>
                    <i class="fa-solid fa-microchip"></i> Run Analysis
                </button>
                <button class="main-btn btn-reset" onclick="location.reload()">
                    <i class="fa-solid fa-xmark"></i> Reset
                </button>
            </div>
        </section>

        <!-- Sidebar: Console & Result -->
        <aside class="side-panel">
            <div class="console-box" id="console">
                <div class="log-entry" style="color: #444;">[SYSTEM INFO] Core initialized...</div>
                <div class="log-entry" style="color: #444;">[SYSTEM INFO] Awaiting data packet...</div>
            </div>

            <div class="result-display" id="resultCard">
                <p style="text-transform: uppercase; font-size: 0.7rem; letter-spacing: 4px; color: #666; font-weight: 700;">Biometric Score</p>
                <div class="big-score" id="scoreValue">0.0</div>
                <div id="statusLabel" style="font-weight: 900; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 2px;">---</div>
                
                <div style="width: 100%; height: 5px; background: #111; margin: 25px 0; border-radius: 10px; overflow: hidden;">
                    <div id="scoreBar" style="height: 100%; width: 0%; background: var(--accent); transition: 1.5s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 0 10px var(--accent);"></div>
                </div>
                <p id="rank-info" style="font-size: 0.75rem; color: #555; font-family: 'JetBrains Mono';"></p>
            </div>
        </aside>
    </main>

    <div class="tier-grid">
        <div class="tier-card">
            <h3 style="color: var(--accent); margin-bottom: 15px;">PRO</h3>
            <div style="font-size: 1.8rem; font-weight: 900; margin-bottom: 10px;">$9.99</div>
            <p style="font-size: 0.8rem; color: #666; margin-bottom: 20px;">PDF Report + Symmetry Analysis</p>
            <button class="main-btn btn-reset" style="width: 100%; padding: 12px;" onclick="alert('Module locked in Beta')">Unlock</button>
        </div>
        <div class="tier-card" style="border-color: var(--accent);">
            <h3 style="color: var(--accent); margin-bottom: 15px;">ELITE</h3>
            <div style="font-size: 1.8rem; font-weight: 900; margin-bottom: 10px;">$19.99</div>
            <p style="font-size: 0.8rem; color: #666; margin-bottom: 20px;">Deep Scan + Anonymous Mode</p>
            <button class="main-btn btn-scan" style="width: 100%; padding: 12px;" onclick="alert('Module locked in Beta')">Join Elite</button>
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const dropContent = document.getElementById('drop-content');
    const scanBtn = document.getElementById('scanBtn');
    const scanner = document.getElementById('scanner');
    const consoleBox = document.getElementById('console');
    const resultCard = document.getElementById('resultCard');
    const scoreValue = document.getElementById('scoreValue');
    const statusLabel = document.getElementById('statusLabel');
    const scoreBar = document.getElementById('scoreBar');

    let rawImageData = null;

    function addLog(text, color = "var(--accent)") {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span style="color: #444;">[${new Date().toLocaleTimeString()}]</span> <span style="color: ${color}">> ${text}</span>`;
        consoleBox.appendChild(entry);
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    function handleFile(file) {
        if (!file) return;
        addLog(`FILE_DETECTED: ${file.name.toUpperCase()}`);
        
        const img = new Image();
        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            
            canvas.style.display = 'block';
            dropContent.style.opacity = '0';
            scanBtn.disabled = false;
            
            // Захватываем данные пикселей для реального анализа
            rawImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            addLog("BUFFER_STORED. READY FOR BIOMETRICS.");
        };
        img.src = URL.createObjectURL(file);
    }

    scanBtn.onclick = async () => {
        scanBtn.disabled = true;
        resultCard.style.display = 'none';
        scanner.style.display = 'block';
        scanner.style.animation = 'scanMove 2s infinite linear';
        
        const steps = [
            "INITIALIZING NEURAL_ENGINE...",
            "MAPPING BIOMETRIC LANDMARKS...",
            "ANALYZING JAWLINE SHARPNESS...",
            "CALCULATING PHI_RATIO...",
            "COMPARING TO SLAYER_DATABASE..."
        ];

        for (let step of steps) {
            addLog(step);
            await new Promise(r => setTimeout(r, 700));
        }

        processRealAnalysis();
    };

    function processRealAnalysis() {
        if (!rawImageData) return;

        // --- ЛОГИКА РЕАЛЬНОГО АНАЛИЗА ---
        // Мы считаем контрастность и плотность пикселей, чтобы оценка зависела от фото
        const data = rawImageData.data;
        let brightnessSum = 0;
        let contrastScore = 0;

        // Выборочный проход по пикселям
        for (let i = 0; i < data.length; i += 40) {
            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];
            const avg = (r + g + b) / 3;
            brightnessSum += avg;

            // Считаем перепады (имитация поиска контуров лица/челюсти)
            if (i > 0) {
                const prevAvg = (data[i-4] + data[i-3] + data[i-2]) / 3;
                contrastScore += Math.abs(avg - prevAvg);
            }
        }

        const finalContrast = contrastScore / (data.length / 40);
        
        // Базовый расчет: контрастное фото с хорошим светом дает больше баллов
        // (Симуляция того, что четкие черты лица = высокий балл)
        let score = (finalContrast / 4) + 3.5 + (Math.random() * 1.5);
        
        // Ограничиваем рамками 3.0 - 9.9
        score = Math.min(9.9, Math.max(3.0, score)).toFixed(1);

        displayResults(parseFloat(score));
    }

    function displayResults(score) {
        scanner.style.display = 'none';
        resultCard.style.display = 'block';
        
        let status = "";
        let color = "#2DD881";

        if (score < 4.5) { status = "SUB-5 (Normie)"; color = "#ff4b4b"; }
        else if (score < 6.5) { status = "MTN (Mid-Tier)"; color = "#ffd151"; }
        else if (score < 8.0) { status = "HTN (High-Tier)"; color = "#7be495"; }
        else if (score < 9.3) { status = "CHAD"; color = "#2dd881"; }
        else { status = "MOGGHUNTER"; color = "#00ff7f"; }

        scoreValue.innerText = score.toFixed(1);
        scoreValue.style.color = color;
        statusLabel.innerText = status;
        statusLabel.style.color = color;
        
        document.getElementById('rank-info').innerText = `DATA_HASH: 0x${Math.random().toString(16).slice(2, 10).toUpperCase()}`;

        setTimeout(() => {
            scoreBar.style.width = (score * 10) + "%";
            scoreBar.style.backgroundColor = color;
        }, 100);

        addLog(`ANALYSIS_SUCCESS. RANK: ${status}`, color);
        addLog("SYSTEM IDLE.");
    }
</script>

</body>
</html>
