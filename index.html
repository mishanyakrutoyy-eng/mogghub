<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOGGHUB | ELITE AI ANALYSIS V4.2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #050806;
            --card: rgba(16, 24, 20, 0.85);
            --card-hover: rgba(20, 30, 25, 0.95);
            --accent: #2DD881;
            --accent-glow: rgba(45, 216, 129, 0.4);
            --text: #e0e0e0;
            --br: 24px;
            --border: rgba(45, 216, 129, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 100px; /* Space for bottom nav */
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(45, 216, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45, 216, 129, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            from { background-position: 0 0; }
            to { background-position: 40px 40px; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .logo span { background: var(--accent); color: var(--bg); padding: 0 8px; border-radius: 6px; margin-left: 4px; }

        .profile-nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.3s;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .nav-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(45, 216, 129, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--accent);
        }

        .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr; /* Centralized for focused UI */
            max-width: 800px;
            margin: 0 auto;
            gap: 25px;
        }

        .analyzer-panel {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--br);
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .drop-zone {
            width: 100%;
            height: 450px;
            border: 1px dashed var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
        }

        #preview-canvas, #video-feed, #overlay-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        #video-feed, #overlay-canvas { display: none; }
        #overlay-canvas { z-index: 2; pointer-events: none; }

        .live-score-tag {
            position: absolute;
            top: 20px; right: 20px;
            background: var(--accent);
            color: var(--bg);
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 900;
            z-index: 10;
            display: none;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: var(--accent);
            box-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
            z-index: 10;
            top: -10px;
            display: none;
        }

        @keyframes scanMove { 0% { top: 0; } 100% { top: 100%; } }

        .status-centered {
            margin-top: 25px;
            padding: 20px;
            background: rgba(45, 216, 129, 0.03);
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .btn-group { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-top: 20px; }
        
        .btn {
            padding: 18px;
            border-radius: 14px;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary { background: var(--accent); color: var(--bg); box-shadow: 0 8px 25px var(--accent-glow); }
        .btn-secondary { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* BOTTOM NAVIGATION - PROBLEM 3 */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(10, 15, 12, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 50px;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #555;
            cursor: pointer;
            transition: 0.3s;
            padding: 10px 0;
            gap: 4px;
        }

        .nav-item i { font-size: 1.2rem; }
        .nav-item span { font-size: 0.65rem; font-weight: 900; text-transform: uppercase; }
        .nav-item.active { color: var(--accent); }
        .nav-item.active i { text-shadow: 0 0 10px var(--accent-glow); }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -45%) scale(0.95);
            background: linear-gradient(145deg, #0a0f0c 0%, #050806 100%);
            border: 1px solid var(--border);
            width: 95%; max-width: 550px;
            max-height: 90vh; overflow-y: auto;
            border-radius: 32px; padding: 40px;
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            scrollbar-width: none;
        }

        .modal-overlay.active .modal-content { transform: translate(-50%, -50%) scale(1); }

        .result-photo-preview {
            width: 80px; height: 80px;
            border-radius: 50%; border: 2px solid var(--accent);
            margin: 0 auto 15px; overflow: hidden; background: #111;
        }
        .result-photo-preview img { width: 100%; height: 100%; object-fit: cover; }

        .result-score-main { font-size: 3rem; font-weight: 900; text-align: center; display: block; color: var(--accent); }
        
        .params-grid { display: grid; gap: 18px; margin: 30px 0; }
        .param-bar-bg { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
        .param-bar-fill { height: 100%; width: 0%; transition: 1.5s ease; background: var(--accent); }

        .avatar-wrapper { position: relative; width: 100px; height: 100px; margin: 0 auto 15px; cursor: pointer; }
        .avatar-circle {
            width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--accent);
            object-fit: cover; background: #111; display: flex; align-items: center;
            justify-content: center; font-size: 2.5rem; color: var(--accent); overflow: hidden;
        }

        .close-modal-btn { position: absolute; top: 25px; right: 25px; color: #444; cursor: pointer; font-size: 1.5rem; }

        @media (max-width: 600px) {
            .drop-zone { height: 350px; }
            .modal-content { padding: 25px; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>

<div class="container">
    <header>
        <div class="logo">MOGG<span>HUB</span></div>
        <div class="profile-nav-btn" onclick="openProfile()">
            <div class="nav-avatar" id="nav-avatar-box"><i class="fa-regular fa-user"></i></div>
            <span id="nav-username">USER</span>
        </div>
    </header>

    <main class="main-grid">
        <section class="analyzer-panel">
            <div class="live-score-tag" id="live-score">0.0</div>
            <div class="drop-zone" id="dropZone" onclick="triggerFileInput()">
                <div class="scanner-line" id="scanner"></div>
                <video id="video-feed" autoplay playsinline muted></video>
                <canvas id="overlay-canvas"></canvas>
                <div id="drop-content" style="text-align: center; z-index: 2;">
                    <i class="fa-solid fa-camera" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
                    <h2 style="font-weight: 900; margin-bottom: 5px;">UPLOAD PHOTO</h2>
                    <p style="color: #666; font-size: 0.8rem; text-transform: uppercase;">Frontal view works best</p>
                </div>
                <canvas id="preview-canvas"></canvas>
            </div>

            <!-- SEPARATE INPUTS - PROBLEM 1 -->
            <input type="file" id="fileInput" hidden accept="image/*">
            <input type="file" id="avatarInput" hidden accept="image/*">

            <div class="btn-group">
                <button class="btn btn-primary" id="scanBtn" disabled>
                    <i class="fa-solid fa-bolt"></i> <span id="scan-text">START ANALYSIS</span>
                </button>
                <button class="btn btn-secondary" onclick="location.reload()">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <div class="status-centered">
                <div style="font-size: 0.75rem; font-weight: 900; color: var(--accent); margin-bottom: 10px;">SYSTEM STATUS</div>
                <div style="display: flex; gap: 20px; justify-content: center; font-size: 0.8rem;">
                    <span style="color: #666;">Engine: <span style="color: var(--accent);">V4.2 Online</span></span>
                    <span style="color: #666;">Database: <span style="color: var(--accent);">Connected</span></span>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- BOTTOM NAV - PROBLEM 3 -->
<nav class="bottom-nav">
    <div class="nav-item active" onclick="switchMode('scan', this)">
        <i class="fa-solid fa-expand"></i>
        <span>SCAN</span>
    </div>
    <div class="nav-item" onclick="switchMode('live', this)">
        <i class="fa-solid fa-video"></i>
        <span>LIVE</span>
    </div>
    <div class="nav-item" onclick="openProfile()">
        <i class="fa-solid fa-user-gear"></i>
        <span>PROFILE</span>
    </div>
</nav>

<!-- MODAL: PROFILE -->
<div class="modal-overlay" id="profileModal">
    <div class="modal-content" style="position: relative; transform: none; top: auto; left: auto; margin: auto;">
        <i class="fa-solid fa-xmark close-modal-btn" onclick="closeProfile()"></i>
        <div style="text-align: center; margin-bottom: 30px;">
            <div class="avatar-wrapper" onclick="document.getElementById('avatarInput').click()">
                <div class="avatar-circle" id="p-avatar-box">U</div>
                <div style="position: absolute; bottom: 0; right: 0; background: var(--accent); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid var(--bg);"><i class="fa-solid fa-pen" style="font-size: 0.7rem; color: #000;"></i></div>
            </div>
            <input type="text" id="p-name" style="background: transparent; border: none; color: #fff; font-size: 1.5rem; font-weight: 900; text-align: center; outline: none;" onchange="updateProfileName(this.value)">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 18px; text-align: center;">
                <span style="color: var(--accent); font-weight: 900; font-size: 1.5rem;" id="st-total">0</span><br>
                <span style="color: #666; font-size: 0.7rem; text-transform: uppercase;">Total Scans</span>
            </div>
            <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 18px; text-align: center;">
                <span style="color: var(--accent); font-weight: 900; font-size: 1.5rem;" id="st-best">--</span><br>
                <span style="color: #666; font-size: 0.7rem; text-transform: uppercase;">Best Score</span>
            </div>
        </div>
        <button class="btn btn-secondary" style="width: 100%; margin-top: 30px; color: #ff3a3a; border-color: rgba(255,58,58,0.2);" onclick="resetData()">ERASE SYSTEM DATA</button>
    </div>
</div>

<!-- MODAL: RESULTS -->
<div class="modal-overlay" id="resultModal">
    <div class="modal-content">
        <div class="result-photo-preview" id="result-photo-preview"></div>
        <span class="result-score-main" id="m-score">0.0</span>
        <div id="m-status-badge" style="text-align: center; font-weight: 900; margin-bottom: 20px;">ROOKIE</div>
        
        <div class="params-grid" id="params-container">
            <!-- Dynamic bars will be here -->
        </div>

        <div class="modal-btn-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <button class="btn btn-primary" onclick="location.reload()">NEW SCAN</button>
            <button class="btn btn-secondary" onclick="closeResultModal()">CLOSE</button>
        </div>
    </div>
</div>

<script>
    let userData = JSON.parse(localStorage.getItem('mogg_data')) || { name: 'USER', avatar: null, totalScans: 0, best: 0, sum: 0 };
    let currentMode = 'scan';
    let stream = null;

    // --- INITIALIZATION ---
    window.onload = () => { updateProfileUI(); };
    function save() { localStorage.setItem('mogg_data', JSON.stringify(userData)); }

    // --- PROBLEM 1: SEPARATED LOGIC ---
    function triggerFileInput() {
        if(currentMode === 'scan') document.getElementById('fileInput').click();
    }

    document.getElementById('avatarInput').onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            userData.avatar = event.target.result;
            save();
            updateProfileUI();
        };
        reader.readAsDataURL(file);
    };

    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const scanBtn = document.getElementById('scanBtn');

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const img = new Image();
        img.onload = () => {
            canvas.width = img.width; canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            canvas.style.display = 'block';
            document.getElementById('drop-content').style.opacity = '0';
            scanBtn.disabled = false;
        };
        img.src = URL.createObjectURL(file);
    };

    // --- PROBLEM 3 & 4: LIVE MODE ---
    async function switchMode(mode, el) {
        currentMode = mode;
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');

        const video = document.getElementById('video-feed');
        const overlay = document.getElementById('overlay-canvas');
        const dropContent = document.getElementById('drop-content');
        const scanText = document.getElementById('scan-text');

        if(mode === 'live') {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                video.style.display = 'block';
                overlay.style.display = 'block';
                dropContent.style.display = 'none';
                canvas.style.display = 'none';
                document.getElementById('live-score').style.display = 'block';
                scanBtn.disabled = false;
                scanText.innerText = "CAPTURE";
                startLiveOverlay();
            } catch (err) {
                alert("Camera access denied");
                switchMode('scan', document.querySelector('.nav-item'));
            }
        } else {
            if(stream) stream.getTracks().forEach(t => t.stop());
            video.style.display = 'none';
            overlay.style.display = 'none';
            dropContent.style.display = 'block';
            document.getElementById('live-score').style.display = 'none';
            scanText.innerText = "START ANALYSIS";
            scanBtn.disabled = !fileInput.files.length;
        }
    }

    function startLiveOverlay() {
        const overlay = document.getElementById('overlay-canvas');
        const octx = overlay.getContext('2d');
        const scoreTag = document.getElementById('live-score');

        function draw() {
            if(currentMode !== 'live') return;
            octx.clearRect(0, 0, overlay.width, overlay.height);
            octx.strokeStyle = 'rgba(45, 216, 129, 0.5)';
            octx.lineWidth = 2;

            // Simple Face Mask logic
            const w = overlay.width; const h = overlay.height;
            octx.beginPath();
            octx.ellipse(w/2, h/2, 80, 110, 0, 0, Math.PI * 2); // Oval
            octx.moveTo(w/2 - 40, h/2 - 20); octx.lineTo(w/2 + 40, h/2 - 20); // Eyes line
            octx.moveTo(w/2 - 30, h/2 + 60); octx.lineTo(w/2 + 30, h/2 + 60); // Jaw line
            octx.stroke();

            // Fake live score flicker
            if(Math.random() > 0.9) {
                scoreTag.innerText = (7 + Math.random() * 2).toFixed(1);
            }
            requestAnimationFrame(draw);
        }
        draw();
    }

    // --- ANALYSIS LOGIC ---
    scanBtn.onclick = async () => {
        if(currentMode === 'live') {
            const video = document.getElementById('video-feed');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('video-feed').style.display = 'none';
            document.getElementById('overlay-canvas').style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('live-score').style.display = 'none';
        }

        const scanner = document.getElementById('scanner');
        scanner.style.display = 'block';
        scanner.style.animation = 'scanMove 2s infinite linear';
        scanBtn.disabled = true;

        await new Promise(r => setTimeout(r, 2000));
        const finalScore = (6.5 + Math.random() * 3).toFixed(1);
        showResult(parseFloat(finalScore));
    };

    function showResult(score) {
        document.getElementById('scanner').style.display = 'none';
        document.getElementById('result-photo-preview').innerHTML = `<img src="${canvas.toDataURL()}">`;
        document.getElementById('m-score').innerText = score.toFixed(1);
        
        const container = document.getElementById('params-container');
        container.innerHTML = '';
        ['Jawline', 'Symmetry', 'Eyes', 'Skin'].forEach(label => {
            const val = (score * 10 - Math.random() * 5).toFixed(0);
            container.innerHTML += `
                <div style="margin-bottom:10px;">
                    <div style="display:flex; justify-content:space-between; font-size:0.7rem; margin-bottom:5px;"><span>${label.toUpperCase()}</span><span>${val}%</span></div>
                    <div class="param-bar-bg"><div class="param-bar-fill" style="width:${val}%"></div></div>
                </div>`;
        });

        userData.totalScans++;
        userData.sum += score;
        if(score > userData.best) userData.best = score;
        save();
        updateProfileUI();
        document.getElementById('resultModal').classList.add('active');
    }

    // --- UI HELPERS ---
    function updateProfileUI() {
        document.getElementById('p-name').value = userData.name;
        document.getElementById('nav-username').innerText = userData.name;
        const avatarBox = document.getElementById('p-avatar-box');
        const navAvatarBox = document.getElementById('nav-avatar-box');
        if(userData.avatar) {
            const img = `<img src="${userData.avatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
            avatarBox.innerHTML = img;
            navAvatarBox.innerHTML = img;
        } else {
            avatarBox.innerText = userData.name[0];
            navAvatarBox.innerHTML = `<i class="fa-regular fa-user"></i>`;
        }
        document.getElementById('st-total').innerText = userData.totalScans;
        document.getElementById('st-best').innerText = userData.best ? userData.best.toFixed(1) : "--";
    }

    function openProfile() { document.getElementById('profileModal').classList.add('active'); }
    function closeProfile() { document.getElementById('profileModal').classList.remove('active'); }
    function closeResultModal() { document.getElementById('resultModal').classList.remove('active'); }
    function updateProfileName(v) { userData.name = v.toUpperCase(); save(); updateProfileUI(); }
    function resetData() { if(confirm("Erase all?")) { localStorage.clear(); location.reload(); } }
</script>

</body>
</html>
