<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOGGHUB | ELITE AI ANALYSIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #050806;
            --card: rgba(16, 24, 20, 0.8);
            --accent: #2DD881;
            --accent-glow: rgba(45, 216, 129, 0.4);
            --text: #e0e0e0;
            --br: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Анимированный фон */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(45, 216, 129, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45, 216, 129, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            from { background-position: 0 0; }
            to { background-position: 50px 50px; }
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 80px;
            animation: slideDown 0.8s ease;
        }

        .logo {
            font-weight: 900;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .logo span { color: #fff; background: var(--accent); color: var(--bg); padding: 0 10px; border-radius: 6px; margin-left: 5px; }

        /* --- Main UI --- */
        .main-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
        }

        .analyzer-panel {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(45, 216, 129, 0.1);
            border-radius: var(--br);
            padding: 40px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            position: relative;
            animation: fadeIn 1s ease 0.2s both;
        }

        .drop-zone {
            width: 100%;
            height: 450px;
            border: 2px dashed rgba(45, 216, 129, 0.2);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            background: rgba(255,255,255,0.02);
        }

        .drop-zone:hover {
            border-color: var(--accent);
            background: rgba(45, 216, 129, 0.05);
            transform: scale(1.01);
        }

        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            position: absolute;
            z-index: 1;
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: var(--accent);
            box-shadow: 0 0 25px var(--accent);
            z-index: 10;
            top: 0;
            display: none;
            animation: scanMove 2.5s infinite ease-in-out;
        }

        @keyframes scanMove {
            0% { top: 0; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- Logs & Stats --- */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 30px;
            animation: fadeIn 1s ease 0.4s both;
        }

        .console-box {
            background: #000;
            border-radius: 20px;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent);
            height: 200px;
            overflow-y: hidden;
            border: 1px solid #111;
        }

        .log-entry { margin-bottom: 5px; opacity: 0.8; }

        .result-display {
            background: var(--card);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            display: none;
        }

        .big-score {
            font-size: 5.5rem;
            font-weight: 900;
            margin: 10px 0;
            filter: drop-shadow(0 0 15px rgba(45, 216, 129, 0.3));
        }

        /* --- Buttons --- */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .main-btn {
            padding: 20px;
            border-radius: 18px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-scan { background: var(--accent); color: var(--bg); box-shadow: 0 10px 30px var(--accent-glow); }
        .btn-scan:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn-scan:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-reset { background: rgba(255,255,255,0.05); color: #fff; }
        .btn-reset:hover { background: rgba(255,255,255,0.1); }

        /* Animations */
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Subscription Cards */
        .plus-banner {
            margin-top: 80px;
            text-align: center;
        }

        .tier-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .tier-card {
            background: rgba(255,255,255,0.02);
            padding: 30px;
            border-radius: var(--br);
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.4s;
        }

        .tier-card:hover { background: rgba(45, 216, 129, 0.03); border-color: var(--accent); }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .drop-zone { height: 350px; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>

<div class="container">
    <header>
        <div class="logo">MOGG<span>HUB</span></div>
        <div style="font-size: 0.8rem; font-weight: 700; letter-spacing: 2px;">V2.0 // CORE ANALYZER</div>
    </header>

    <main class="main-grid">
        <!-- Левая панель: Анализатор -->
        <section class="analyzer-panel">
            <div class="drop-zone" id="dropZone">
                <div class="scanner-line" id="scanner"></div>
                <div id="drop-content" style="text-align: center; z-index: 2;">
                    <i class="fa-solid fa-expand" style="font-size: 3rem; color: var(--accent); margin-bottom: 20px;"></i>
                    <h2 style="font-weight: 900; margin-bottom: 10px;">DROP YOUR FACE</h2>
                    <p style="color: #666; font-size: 0.9rem;">AI будет сканировать каждый пиксель</p>
                </div>
                <img id="preview" alt="User Face">
                <input type="file" id="fileInput" hidden accept="image/*">
            </div>

            <div class="btn-group">
                <button class="main-btn btn-scan" id="scanBtn" disabled>
                    <i class="fa-solid fa-microchip"></i> Start Scan
                </button>
                <button class="main-btn btn-reset" id="resetBtn">
                    <i class="fa-solid fa-xmark"></i> Clear
                </button>
            </div>
        </section>

        <!-- Правая панель: Логи и Результат -->
        <aside class="side-panel">
            <div class="console-box" id="console">
                <div class="log-entry">> SYSTEM READY...</div>
                <div class="log-entry">> AWAITING UPLOAD...</div>
            </div>

            <div class="result-display" id="resultCard">
                <p style="text-transform: uppercase; font-size: 0.7rem; letter-spacing: 3px; color: #666;">Final Rating</p>
                <div class="big-score" id="scoreValue">0.0</div>
                <div id="statusLabel" style="font-weight: 900; font-size: 1.2rem; text-transform: uppercase;">---</div>
                <div style="width: 100%; height: 4px; background: #222; margin: 20px 0; border-radius: 2px;">
                    <div id="scoreBar" style="height: 100%; width: 0%; background: var(--accent); transition: 1.5s cubic-bezier(0.22, 1, 0.36, 1);"></div>
                </div>
            </div>
        </aside>
    </main>

    <section class="plus-banner">
        <h2 style="font-weight: 900; font-size: 2rem;">UPGRADE TO <span style="color: var(--accent);">MOGGHUB+</span></h2>
        <div class="tier-grid">
            <div class="tier-card">
                <h3 style="margin-bottom: 10px;">PRO ACCESS</h3>
                <div style="font-size: 1.5rem; font-weight: 900; margin-bottom: 20px;">$9.99</div>
                <button class="main-btn btn-reset" style="width: 100%;" onclick="alert('Redirecting to payment...')">Get Pro</button>
            </div>
            <div class="tier-card" style="border-color: var(--accent);">
                <h3 style="margin-bottom: 10px;">ELITE SLAYER</h3>
                <div style="font-size: 1.5rem; font-weight: 900; margin-bottom: 20px;">$19.99</div>
                <button class="main-btn btn-scan" style="width: 100%;" onclick="alert('Redirecting to payment...')">Get Elite</button>
            </div>
        </div>
    </section>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const preview = document.getElementById('preview');
    const dropContent = document.getElementById('drop-content');
    const scanBtn = document.getElementById('scanBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scanner = document.getElementById('scanner');
    const consoleBox = document.getElementById('console');
    const resultCard = document.getElementById('resultCard');
    const scoreValue = document.getElementById('scoreValue');
    const statusLabel = document.getElementById('statusLabel');
    const scoreBar = document.getElementById('scoreBar');

    function addLog(text) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerText = `> ${text}`;
        consoleBox.appendChild(entry);
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    // Обработка файлов
    dropZone.onclick = () => fileInput.click();
    
    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    function handleFile(file) {
        if (!file) return;
        addLog(`FILE DETECTED: ${file.name.toUpperCase()}`);
        addLog(`SIZE: ${(file.size/1024).toFixed(2)} KB`);
        
        const reader = new FileReader();
        reader.onload = (e) => {
            preview.src = e.target.result;
            preview.style.display = 'block';
            dropContent.style.opacity = '0';
            scanBtn.disabled = false;
            addLog("IMAGE LOADED INTO BUFFER.");
        };
        reader.readAsDataURL(file);
    }

    // Логика сканирования
    scanBtn.onclick = async () => {
        scanBtn.disabled = true;
        resultCard.style.display = 'none';
        scanner.style.display = 'block';
        
        const phases = [
            "INITIALIZING NEURAL NETWORK...",
            "ANALYZING BONE STRUCTURE...",
            "MEASURING CANTHAL TILT...",
            "CALCULATING JAWLINE ANGLE...",
            "MAPPING MIDFACE RATIO...",
            "COMPARING TO ELITE DATABASE..."
        ];

        for (let phase of phases) {
            addLog(phase);
            await new Promise(r => setTimeout(r, 600));
        }

        finishAnalysis();
    };

    function finishAnalysis() {
        scanner.style.display = 'none';
        resultCard.style.display = 'block';
        
        // Алгоритм (имитация на основе параметров файла)
        const nameLen = preview.src.length;
        let score = (nameLen % 7) + 3 + (Math.random() * 2);
        score = Math.min(10, Math.max(1, score)).toFixed(1);

        let status = "";
        let color = "#2DD881";

        if (score < 4) { status = "SUB-5"; color = "#ff4b4b"; }
        else if (score < 6) { status = "MTN (Mid-Tier)"; color = "#ffd151"; }
        else if (score < 7.5) { status = "HTN (High-Tier)"; color = "#7be495"; }
        else if (score < 9) { status = "CHAD"; color = "#2dd881"; }
        else { status = "MOGGHUNTER"; color = "#00ff7f"; }

        scoreValue.innerText = score;
        scoreValue.style.color = color;
        statusLabel.innerText = status;
        statusLabel.style.color = color;
        
        setTimeout(() => {
            scoreBar.style.width = (score * 10) + "%";
            scoreBar.style.backgroundColor = color;
        }, 100);

        addLog(`ANALYSIS COMPLETE. RANK: ${status}`);
        addLog("SYSTEM IDLE.");
    }

    resetBtn.onclick = () => {
        preview.style.display = 'none';
        dropContent.style.opacity = '1';
        scanBtn.disabled = true;
        resultCard.style.display = 'none';
        fileInput.value = "";
        addLog("SYSTEM RESET.");
    };
</script>

</body>
</html>
